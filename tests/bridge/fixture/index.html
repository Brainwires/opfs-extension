<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OPFS bridge fixture</title>
  </head>
  <body>
    <h1>OPFS bridge fixture</h1>
    <p>This page is loaded by Playwright. Tests inject the bridge installer into it,
    then exercise the <code>__BRAINWIRES_OPFS__</code> API directly via
    <code>page.evaluate</code>.</p>
    <script type="module">
      // Wipe OPFS on every load so each test starts clean.
      (async () => {
        if (!navigator.storage?.getDirectory) return;
        const root = await navigator.storage.getDirectory();
        for await (const [name] of root.entries()) {
          await root.removeEntry(name, { recursive: true }).catch(() => {});
        }
        window.__OPFS_READY__ = true;
      })();
    </script>
  </body>
</html>
