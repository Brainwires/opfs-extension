name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache rsqlite-wasm cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/rsqlite-wasm/target
          key: rsqlite-wasm-${{ runner.os }}-${{ hashFiles('vendor/rsqlite-wasm/Cargo.lock', 'vendor/rsqlite-wasm/**/Cargo.toml') }}

      - name: Build rsqlite-wasm
        run: pnpm setup:rsqlite

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:bridge

      - run: pnpm build

      - run: pnpm validate:dist

      - name: Package extension
        run: |
          cd dist
          zip -r ../brainwires-opfs-${{ github.ref_name }}.zip . -x '*.map'

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: brainwires-opfs-${{ github.ref_name }}.zip
          generate_release_notes: true
