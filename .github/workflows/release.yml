name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache rsqlite-wasm cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/rsqlite-wasm/target
          key: rsqlite-wasm-${{ runner.os }}-${{ hashFiles('vendor/rsqlite-wasm/Cargo.lock', 'vendor/rsqlite-wasm/**/Cargo.toml') }}

      - name: Build rsqlite-wasm
        run: pnpm setup:rsqlite

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:bridge

      - run: pnpm build

      - run: pnpm validate:dist

      - name: Package extension zip
        run: |
          cd dist
          zip -r ../brainwires-opfs-${{ github.ref_name }}.zip . -x '*.map'

      - name: Bundle CLI
        run: pnpm cli:bundle

      # Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
      # Configure once at https://www.npmjs.com/package/brainwires-opfs/access
      # → Trusted Publishers → add: GitHub repo Brainwires/opfs-extension,
      # workflow .github/workflows/release.yml. The first publish claims the
      # name; for that initial bootstrap you must either (a) pre-create the
      # package on npm and add the trusted publisher first, or (b) do a single
      # manual `npm publish` from a logged-in machine to claim the name.
      - name: Use latest npm (Trusted Publishing requires npm >= 11.5)
        run: npm install -g npm@latest

      - name: Publish CLI to npm via Trusted Publishing
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd cli && npm publish --provenance --access public

      - name: Upload zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: brainwires-opfs-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            npx brainwires-opfs@${{ github.ref_name }}
            # or
            npx brainwires-opfs@latest
            ```

            See the auto-generated changelog below.
